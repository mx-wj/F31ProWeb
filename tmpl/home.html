<div class="row margin-top-20" id="home_image">

    <div class="row">
        <div style="position: relative">

            <div class="internet_status_container">
                <div data-bind=" css: {'item_icon_connect': cStatus()== 1, 'item_icon_disconnect': cStatus() != 1}"></div>
                <h3 class="home_h3" data-trans="net_surfing"></h3>
                <div class="net_surfing_list">
                    <ul>
                        <li><a href="javascript: void(0)" id="h_connect_btn"
                               data-bind="visible: canConnect() && isShowHomeConnect(), click: connectHandler , css: {'h_connect_on': cStatus()== 1, 'h_connect_off': cStatus() != 1}"
                               style="display: none;"></a></li>
                        <li><i class="up"></i><span data-bind="text: up_Speed"></span></li>
                        <li><i class="down"></i><span data-bind="text: down_Speed"></span></li>
                        <li><span data-bind="text: connected_Time"></span></li>
                    </ul>
                </div>
            </div>

            <div class="network_control_container">
                <div class="item_icon"></div>
                <h3 class="home_h3" data-trans="my_router"></h3>
                <!--			<div id="h_network_type" data-bind="text: networkType, css: {'no-btn': !(canConnect() && isShowHomeConnect())}"></div>-->
                <div class="my_router_list">
                    <ul>
                        <!--					<li data-bind="visible: hasRj45"><a id="opmode" href="javascript:void(0)" data-bind="click: showOpModeWindow, css: {'not-allowed': enableFlag}"></a></li>-->
                        <li><a href="javascript:void(0)" data-bind="click: showNetworkSettingsWindow"
                               data-trans="settings_internet"></a></li>
                        <li>
                            <div id="h_ssid"></div>
                        </li>
                        <li data-bind="visible: notDataCard && hasWifi"><a href="#wifi_main"
                                                                           data-trans="settings_wireless"></a></li>
                    </ul>
                </div>
            </div>

            <!--        <div id="h_connect_status" data-bind="visible:notDataCard, css: {'h_status_connected': cStatus()== 1, 'h_status_disconnected': cStatus()== 2, 'h_status_connecting': cStatus()== 3, 'h_status_disconnecting': cStatus()== 4, }">-->
            <!--        </div>-->

            <div class="connected_devices_container" data-bind="visible: notDataCard"
                 >
                <div onclick="window.location.hash='#station_info'" data-bind="visible:hasWifi" class="item_icon"></div>
                <h3 onclick="window.location.hash='#station_info'" data-bind="visible:hasWifi" class="home_h3" data-trans="station_info"></h3>
                <div onclick="window.location.hash='#station_info'" style="text-align:center;display:inline" data-bind="visible:hasWifi" class="margin-top-20">
                    <div id="h_wire_device" data-bind="visible: hasRj45 && isCPE">
                        <span data-bind="text: wireDeviceNum" style="font-size:70px;"><em></em></span><sub
                            style="font-size: 16px;" data-trans="device_unit"></sub>
                        <span data-trans="cable" style="font-size:15px;text-align:center;display:block"></span>
                    </div>
                    <div id="h_wireless_device" data-bind="visible:hasWifi">
                        <span data-bind="text: wirelessDeviceNum" style="font-size:70px"></span><sub
                            style="font-size: 16px;" data-trans="device_unit"></sub>
                        <span data-trans="wireless" style="font-size:15px;text-align:center;display:block"></span>
                    </div>
                </div>
                <a onclick="window.location.hash='#station_info'" href="#station_info" id="h_attached_device_link">
                </a>
            </div>
        </div>
    </div>
</div>


<div class="row margin-top-20 label-font-normal margin-bottom-20">

    <div class="text-center traffic_control_container" data-bind="visible: showTraffic() && disable_traffic_manager" >

        <h4 data-trans="traffic_data_plan" style="font-size:14px;text-align:right;padding-right:15px"></h4>
        <div style="display:inline-block">
            <div id="traffic_graphic" style="width: 200px; height: 165px; visibility: visible;"></div>
        </div>
        <div style="text-align: left;padding-left:20px;font-size:18px">
            <span class="color_block" style="background-color: #8CC916;"></span>
            <span class="color_block_desc" data-trans="traffic_used"></span>
            <span class="color_block_desc">:</span>
            <span class="color_block_desc" data-bind="text: trafficUsed"></span>
        </div>
        <div class="statistics_list" style="margin-top:-10px;font-size:15px">
            <ul>
                <li><a href="#traffic_alert">
                    <div data-bind="visible: trafficAlertEnable">
                        <span class="line-height-20" style="font-size:15px" data-bind="text: trafficLimited"></span>
                        <span class="line-height-20" style="font-size:15px" data-trans="traffic_limit_data"></span>
                    </div>
                    <div data-bind="visible: trafficAlertEnable() == false">
                        <div class="line-height-20" style="font-size:15px" data-trans="traffic_not_set_limited"></div>
                    </div>
                </a></li>
            </ul>
        </div>
    </div>


    <div class="device_info_container" style="position:relative;"
         data-bind="css:{'device_info_container_hastraffic':showTraffic(),'device_info_container_hastraffic2':showTraffic()&&!disable_traffic_manager, 'device_info_container_notraffic':!showTraffic()},
         style: { width: disable_traffic_manager? '580px': '880px'}">

        <h4 data-trans="device_info" style="font-size:14px;text-align:left;padding-left:15px;color:#fff"></h4>


        <div style="color:#fff;position: relative;height: 210px;font-size: 18px;line-height: 1em;padding:0px 0px 0px 15px;">
            <div class="row" data-bind="visible:display_model">
                <label class="col-xs-5" data-trans="terminal_type"></label>
                <label class="col-xs-7" data-bind="text: product_model_prefix"></label>
            </div>
            <div class="row">
                <label class="col-xs-5" data-trans="sim_serial_number"></label>
                <label class="col-xs-7" data-bind="text: simSerialNumber"></label>
            </div>
            <div class="row">
                <label class="col-xs-5" data-trans="imei"></label>
                <label class="col-xs-7" data-bind="text: imei"></label>
            </div>
            <div class="row">
                <label class="col-xs-5" data-trans="imsi"></label>
                <label class="col-xs-7" data-bind="text: imsi"></label>
            </div>
            <!--			<div class="row" data-bind="visible: notDataCard">-->
            <!--				<label class="col-xs-5" data-trans="wifi_range"></label>-->
            <!--				<label class="col-xs-7" data-bind="attr: {'data-trans': wifiLongMode}"></label>-->
            <!--			</div>-->
            <div class="row" data-bind="visible:hide_band() !='1' ">
                <label class="col-xs-5" data-trans="bandinfo"></label>
                <label class="col-xs-7" data-bind="text: CurrentBand"></label>
            </div>
            <div class="row" data-bind="visible:hide_wfrcn_pci() !='1' ">
                <label class="col-xs-5" data-trans="wfrcn_pci"></label>
                <label class="col-xs-7" data-bind="text: wfrcn_pci "></label>
            </div>
            <div class="row">
                <label class="col-xs-5" data-trans="signal_strength_label"></label>
                <label class="col-xs-7" id="fresh_signal_strength"></label>
            </div>
            <div class="row" data-bind="visible: hasWifi && showMultiSsid()">
                <label class="col-xs-5" data-trans="network_name_ssid1"></label>
                <label class="col-xs-7" data-bind="text: ssid" style="word-wrap: break-word;"></label>
            </div>
            <div class="row" data-bind="visible: hasWifi && !showMultiSsid()">
                <label class="col-xs-5" data-trans="network_name"></label>
                <label class="col-xs-7" data-bind="text: ssid" style="word-wrap: break-word;"></label>
            </div>
            <div class="row" data-bind="visible: hide_wifi_password()">
                <label class="col-xs-5" data-trans="WiFiPassword"></label>
                <label class="col-xs-7" data-bind="text: WiFiPassword"></label>
            </div>
            <div data-bind="visible: sleepmode_display" class="row">
                <label class="col-xs-5" data-trans="WiFiCoverageArea"></label>
                <!-- modify 20210904 通过此方式修复切换语言时，无法及时更新的文本显示的问题。-->
                <label class="col-xs-7" id="id_WiFiCoverageArea"></label>
            </div>
        </div>
        <div class="text-center" id="h_qrcode" data-bind="visible: showQRCode"
             style="position: absolute;bottom: 42px;right: 12px">
            <img src="./img/blacktrans.png" width="111" id="qrcode_img" data-bind="attr: {src: qrcodeSrc}"/>
        </div>
        <div style="text-align:right;">
             	<!-- <a href="javascript: void(0)" data-trans="detail_info" id="showDetailInfo" tabindex="0"></a> -->
	 	<a href="javascript: void(0)" data-trans="detail_info" id="showDetailInfo" ></a>
	</div>
    </div>

    <div style="margin: 0 auto; width:400px;padding-top: 48px; text-align: center;">
        <span data-trans='copyright'></span>
        <a  target="_blank"   href="#ZTE_privacy_statement" data-bind="visible:user_web_disp_privacy_statement()">隐私声明 </a> 
        <a data-bind="visible:user_web_disp_privacy_statement() && user_web_disp_opensource_statement()" href="">|</a> 
        <a target="_blank" href="https://opensource.ztedevices.com/" data-bind="visible:user_web_disp_opensource_statement()"> 开源声明</a>
    </div>


</div>
