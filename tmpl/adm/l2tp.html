<div id="innerContainer">
    <div class="row header-row">
        <div class="col-xs-1">
            <a href="#home">
                <img alt="" src="img/arrow-back.png">
            </a>
        </div>
        <div class="col-xs-11">
            <div class="form-title">
                <h1 data-trans='advanced_settings'></h1>
            </div>
        </div>
    </div>
	<div class="row">
		<div class="col-xs-2">
			<div class="nav_right">
				<ul>
					<li data-bind="sleepmode_display"><a href="#sleep_mode" data-trans="sleep_mode"></a></li>
				<li><a href="#router_setting" data-trans="router_setting"></a></li>
				<li><a href="#firewall" data-trans="firewall"></a></li>
				<li><a href="#telnetd" data-trans="telnetd"></a></li>
				<li><a href="#ussd" data-trans="USSD"></a></li>
				<li><a href="#ddns" data-trans="DDNS"></a></li>
				<li><a href="#ping_setting" data-trans="ping_setting"></a></li>
				<li><a href="#break_detection" data-trans="break_detection"></a></li>
				<li><a href="#l2tp" data-trans="vpn"></a></li>
				<li><a href="#advance3111" data-trans="TTL"></a></li>
				<li><a href="#advance3113" data-trans="ESIM/SIM"></a></li>
					<li><a data-trans="others" href="#others"></a></li>
				</ul>
			</div>
		</div>
		<div class="col-xs-10">
			<h4 class="form-title" data-trans="vpn"></h4>
			<form id="l2tpForm">
				<div class="advance_box content">
					<div class="row form-group">
						<label class="col-xs-4 side-right" data-trans="connection_type"></label>
						<select id='connectType'
							data-bind="options: connectType, optionsValue: 'value', optionsText: 'text', value: currentType,event:{ change: connectTypeChangeHandler}">
						</select>
					</div>
					<div class="row form-group">
						<label class="col-xs-4 side-right" data-trans="connect_status"></label>
						<label data-bind="text: connect_status"></label>
					</div>
					<div class="row form-group">
						<label class="col-xs-4 side-right" data-trans="enable"></label>
						<input type="checkbox" data-bind="checked: enableL2TP">
					</div>
					<!-- <div style="margin-left:0;margin-right: 0;" class="row"> -->
						<div class="row form-group">
							<label class="col-xs-4 side-right" data-trans="lns_address"></label>
							<!-- <div class="col-xs-4"> -->
								<input type="text" data-bind="value: lns_address" class="required ipAddress">
							<!-- </div> -->
						</div>
						<div class="row form-group">
							<label class="col-xs-4 side-right" data-trans='host_name'></label>
							<!-- <div class="col-xs-4"> -->
								<input type="text" name="host_name" id="host_name" data-bind="value: host_name"
									class="required"/>
							<!-- </div> -->
						</div>
					<!-- </div> -->
					<div class="row form-group">
						<label class="col-xs-4 side-right" data-trans="tunnei_pass"></label>
						<input type="text" data-bind="value: tunnei_pass">
					</div>
					<div class="row form-group">
						<label class="col-xs-4 side-right" data-trans="handshake"></label>
						<input type="text" data-bind="value: handshake">
					</div>
					<!-- <div class="row" style="margin-left:0;margin-right: 0;"> -->
						<div class="row form-group">
							<label class="col-xs-4 side-right" data-trans="ppp_user"></label>
							<!-- <div class="col-xs-4"> -->
								<input type="text" name='ppp_user' id='ppp_user' data-bind="value: ppp_user" class="required">
							<!-- </div> -->
						</div>
						<div class="row form-group">
							<label class="col-xs-4 side-right" data-trans="ppp_pass"></label>
							<!-- <div class="col-xs-4"> -->
								<input type="text" name="ppp_pass" id='ppp_pass' data-bind="value: ppp_pass" class="required">
							<!-- </div> -->
						</div>
					<!-- </div> -->
					<div data-bind="visible: currentType() === 'PPTP'">
						<div class="row form-group">
							<label class="col-xs-4 side-right" data-trans="auth"></label>
							<select
								data-bind="options: authList, optionsValue: 'value', optionsText: 'text', value: currentAuth">
							</select>
						</div>
					</div>
				</div>
				<hr>
				<!-- <button style="position: absolute;right:20px;" data-trans="apply"
					class="bottom_btn btn btn-default btn-primary" data-bind="click: apply"></button> -->
				<div class="form-buttons">
					<input type="submit" class="btn btn-primary margin-right-20" data-trans="apply" />
				</div>

			</form>
		</div>
	</div>

</div>
