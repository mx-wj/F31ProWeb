<div id="innerContainer">
    <div class="row header-row">
        <div class="col-xs-1">
            <a href="#home">
                <img alt="" src="img/arrow-back.png">
            </a>
        </div>
        <div class="col-xs-11">
            <div class="form-title">
                <h1 data-trans='advanced_settings'></h1>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-xs-2">
            <div class="nav_right">
                <ul>
                    <li data-bind="sleepmode_display"><a href="#sleep_mode" data-trans="sleep_mode"></a></li>
				<li><a href="#router_setting" data-trans="router_setting"></a></li>
				<li><a href="#firewall" data-trans="firewall"></a></li>
				<li><a href="#telnetd" data-trans="telnetd"></a></li>
				<li><a href="#ussd" data-trans="USSD"></a></li>
				<li><a href="#ddns" data-trans="DDNS"></a></li>
				<li><a href="#ping_setting" data-trans="ping_setting"></a></li>
				<li><a href="#break_detection" data-trans="break_detection"></a></li>
				<li><a href="#l2tp" data-trans="vpn"></a></li>
				<li><a href="#advance3111" data-trans="TTL"></a></li>
				<li><a href="#advance3113" data-trans="ESIM/SIM"></a></li>
                    <li><a data-trans="others" href="#others"></a></li>

                </ul>
            </div>
        </div>
        <div class="col-xs-10">
            <form id='EsimSim_Pwd_form' data-bind="visible:currentPage()==0">
                <h3 class="form-title" data-trans="esim_sim_modify"></h3>
                <div class="row form-group margin-top-50">
                    <span data-trans="esim_sim_input" class="col-xs-2"></span>
                    <input id="txtInputEsimSim" type="password" class="col-xs-3" data-bind='value: password' maxlength="24">
                </div>
                <div class="form-buttons">
                    <input type="submit" class="btn btn-primary" data-trans="login"/>
                </div>
            </form>

            <form id='EsimSim_Setting_form' data-bind="visible:currentPage()==1">
                <h3 class="form-title" data-trans="esim_sim_modify"></h3>
                <div class="row form-group margin-top-50">
                    <label class="col-xs-5 side-right" data-trans="esim_sim_setting"></label>
                    <div class="col-xs-6">
                        <div class="row">
                            <div class="col-xs-4" data-bind="visible: Esim_num0">
                                <input type="radio" name="EsimSimGrp" id="EsimSimDisable"
                                    data-bind="checked: EsimSimSetting" value="0" />
                                <label for="EsimSimDisable" data-bind="text:Esim_num0"></label>
                            </div>
                            <div class="col-xs-4" data-bind="visible: Esim_num1">
                                <input type="radio" name="EsimSimGrp" id="EsimSimEnable"
                                    data-bind="checked: EsimSimSetting" value="1" />
                                <label for="EsimSimEnable" data-bind="text:Esim_num1"></label>
                            </div>
                            <div class="col-xs-4" data-bind="visible: Esim_num()=='2' && Esim_num2">
                                <input type="radio" name="EsimSimGrp" id="EsimSim2Enable"
                                    data-bind="checked: EsimSimSetting" value="2" />
                                <label for="EsimSim2Enable" data-bind="text:Esim_num2"></label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-buttons">
                    <input type="submit" class="btn btn-primary" data-trans="apply" />
                </div>

                <div class="form-note">
                    <div class="notes-title">&nbsp;</div>
                    <ul class="notes-content">
                        <li data-trans="esim_sim_note_info"></li>
                        
                    </ul>
                </div>
            </form>
        </div>
    </div>
</div>
